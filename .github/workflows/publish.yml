# Reusable workflow that publishes to npm the packages released with @brillout/release-me — without npm token, using npm's trusted publishing.
# It's called by .github/workflows/release.yml, generated by `$ pnpm exec release-me init-github-action` (see https://github.com/brillout/release-me#github-action):
# - Stable release: `$ pnpm exec release-me patch` (or minor/major/v1.2.3) pushes the release tag (`v1.2.3` or `some-package@1.2.3`), which triggers the workflow.
# - Commit release (x.y.z-commit-<hash>): `$ pnpm exec release-me commit` triggers the workflow via `workflow_dispatch`.
# - "Run workflow" button, with the inputs:
#   - `ref`: a commit (SHA, branch, or refs/pull/<number>/head) => commit release; or a release tag => (re-)publish that stable release.
#     Default: the commit the workflow runs on (or, if a tag is selected in "Use workflow from", that tag).
#   - `package`: commit release only: the package to release. Default: all packages that have @brillout/release-me in their devDependencies.
#   The inputs are read from the caller's event (`github.event.inputs`), so the caller doesn't have to pass them with `with:`.
# The calling workflow has no options (release-me fails if it differs from what the command generates): the build uses the latest Node.js LTS, and the pnpm version of package.json#packageManager (or the latest pnpm).

name: Publish to npm

on:
  workflow_call:

permissions: {}

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    # This job doesn't run any code of the repository: the other jobs trust its outputs.
    permissions:
      contents: read
    outputs:
      release: ${{ steps.resolve.outputs.release }}
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      provenance: ${{ steps.resolve.outputs.provenance }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stable() { # $1: release tag, $2: the tag's commit
            {
              echo release=stable
              echo "tag=$1"
              echo "ref=refs/tags/$1"
              # Provenance attests that the package was built from GITHUB_SHA (the commit the workflow run belongs to)
              if [ "$2" = "$GITHUB_SHA" ]; then echo provenance=true; else echo provenance=false; fi
            } >> "$GITHUB_OUTPUT"
            echo "Stable release: $1"
            if [ "$2" != "$GITHUB_SHA" ]; then
              echo "::notice::$1 is published without npm provenance, because the workflow runs on another commit. (To get provenance, leave the input empty and select the tag $1 in \"Use workflow from\".)"
            fi
          }
          commit() { # $1: the commit to release
            { echo release=commit; echo "ref=$1"; echo provenance=false; } >> "$GITHUB_OUTPUT"
            echo "Commit release: $1"
          }
          if [ "$EVENT_NAME" = push ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::Stable releases are triggered by pushing a release tag, but the $REF_TYPE $REF_NAME was pushed."
              exit 1
            fi
            stable "$REF_NAME" "$GITHUB_SHA"
          elif [ -z "$INPUT_REF" ]; then
            if [ "$REF_TYPE" = tag ]; then stable "$REF_NAME" "$GITHUB_SHA"; else commit "$GITHUB_SHA"; fi
          else
            if [[ "$INPUT_REF" =~ [[:space:]] ]]; then
              echo "::error::Invalid commit or tag: $INPUT_REF"
              exit 1
            fi
            # A release tag (v1.2.3, some-package@1.2.3, @some-scope/some-package@1.2.3) that exists => stable release
            tag_commit=""
            if [[ "$INPUT_REF" =~ ^v[0-9][^/@]*$ || "$INPUT_REF" =~ ^(@[^/@]+/)?[^/@]+@[0-9][^/@]*$ ]]; then
              if object=$(gh api "repos/$REPO/git/ref/tags/$INPUT_REF" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
                read -r object_type tag_commit <<< "$object"
                # Annotated tag => the commit it points to
                if [ "$object_type" = tag ]; then tag_commit=$(gh api "repos/$REPO/git/tags/$tag_commit" --jq .object.sha); fi
              fi
            fi
            if [ -n "$tag_commit" ]; then stable "$INPUT_REF" "$tag_commit"; else commit "$INPUT_REF"; fi
          fi

  pack:
    name: Build & pack
    needs: resolve
    runs-on: ubuntu-latest
    # This job runs the repository's code (install scripts, build scripts, ...), which may be untrusted (e.g. a commit release of a pull request from a fork) => it isn't allowed to publish to npm.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - name: Get pnpm version
        id: pnpm-version
        # pnpm/action-setup reads package.json#packageManager (or devEngines.packageManager) and requires `version` only if package.json doesn't specify pnpm's version
        run: |
          node -e '
            const pkg = require("./package.json")
            const devEngines = [pkg.devEngines?.packageManager].flat()
            const isSpecified = String(pkg.packageManager).startsWith("pnpm@") || devEngines.some((pm) => pm?.name === "pnpm" && pm.version)
            console.log(`version=${isSpecified ? "" : "latest"}`)
          ' >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.pnpm-version.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          # No cache: untrusted code could poison it for subsequent releases.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build & pack
        env:
          RELEASE: ${{ needs.resolve.outputs.release }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGE: ${{ github.event.inputs.package }}
          OUT_DIR: ${{ runner.temp }}/release-me-packages
        run: |
          if [ "$RELEASE" = stable ]; then
            set -- "$TAG"
          else
            set -- commit
            if [ -n "$PACKAGE" ]; then set -- commit --package "$PACKAGE"; fi
          fi
          # Use the @brillout/release-me version installed by the repository
          package_json=$(git grep -l '"@brillout/release-me"' -- '*package.json' | head -n 1 || true)
          if [ -z "$package_json" ]; then
            echo "::error::No package.json has @brillout/release-me in its devDependencies."
            exit 1
          fi
          cd "$(dirname "$package_json")"
          pnpm exec release-me ci-pack "$@" --out "$OUT_DIR"
      - uses: actions/upload-artifact@v7
        with:
          name: release-me-packages
          path: ${{ runner.temp }}/release-me-packages/*.tgz
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish to npm
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    # This job doesn't run any code of the repository: it's the only job allowed to publish to npm (trusted publishing authenticates with the GitHub OIDC token).
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      # Trusted publishing requires npm >= 11.5.1, and removing a dist-tag requires npm >= 11.21.0
      - run: npm install --global npm@latest
      - uses: actions/download-artifact@v8
        with:
          name: release-me-packages
          path: ${{ runner.temp }}/release-me-packages
      - name: Publish
        env:
          PACKAGES_DIR: ${{ runner.temp }}/release-me-packages
          RELEASE: ${{ needs.resolve.outputs.release }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PROVENANCE: ${{ needs.resolve.outputs.provenance }}
        run: |
          node <<'EOF'
          const fs = require('fs')
          const path = require('path')
          const { execFileSync } = require('child_process')
          const { PACKAGES_DIR, RELEASE, TAG, PROVENANCE, GITHUB_STEP_SUMMARY } = process.env
          if (RELEASE !== 'stable' && RELEASE !== 'commit') fail(`Unknown release type ${JSON.stringify(RELEASE)}.`)
          const isStableRelease = RELEASE === 'stable'

          // The tarballs were made by the `pack` job, which runs the repository's code: verify the package.json inside each tarball (that's what npm publishes).
          const packages = fs
            .readdirSync(PACKAGES_DIR)
            .filter((file) => file.endsWith('.tgz'))
            .map((file) => {
              const tarball = path.join(PACKAGES_DIR, file)
              const pkg = JSON.parse(execFileSync('tar', ['-xzOf', tarball, 'package/package.json'], { encoding: 'utf8' }))
              return { tarball, name: pkg.name, version: pkg.version, hasPublishConfigTag: !!pkg.publishConfig?.tag }
            })
          if (packages.length === 0) fail('No package to publish.')

          let toPublish
          if (isStableRelease) {
            const main = packages.find((p) => TAG === `v${p.version}` || TAG === `${p.name}@${p.version}`)
            if (!main) fail(`No package matches the Git tag ${JSON.stringify(TAG)}: ${list(packages)}`)
            const others = packages.filter((p) => p !== main)
            for (const p of others) {
              if (p.name !== `create-${main.name}`) fail(`Unexpected package ${JSON.stringify(p.name)}: only ${main.name} and its boilerplate create-${main.name} are published.`)
            }
            // npm requires an explicit tag for pre-release versions and for versions lower than the highest published version: use `latest`, as `$ pnpm publish` does (unless package.json#publishConfig.tag is set).
            toPublish = [main, ...others].map((p) => ({ ...p, tag: p.hasPublishConfigTag ? null : 'latest', provenance: PROVENANCE === 'true' }))
          } else {
            toPublish = packages.map((p) => {
              // A pre-release version, so that semver ranges such as ^1.2.3 never match it.
              if (!/^\d+\.\d+\.\d+-(?:[0-9A-Za-z.-]+-)?commit-[0-9a-f]{7}$/.test(p.version)) fail(`${JSON.stringify(`${p.name}@${p.version}`)} isn't a commit release version (x.y.z-commit-<hash>).`)
              // - `$ npm publish` always sets a tag: use the tag `commit` and remove it afterwards.
              // - No provenance: it would point to the commit the workflow run belongs to (the tip of the branch selected in "Use workflow from"), which isn't necessarily the released commit.
              return { ...p, tag: 'commit', removeTag: true, provenance: false }
            })
          }

          const summary = []
          for (const p of toPublish) {
            const spec = `${p.name}@${p.version}`
            if (isPublished(p)) {
              console.log(`${spec} is already published, skipping it.`)
            } else {
              const args = ['publish', p.tarball]
              if (p.tag) args.push('--tag', p.tag)
              npm(args, p.provenance ? {} : { NPM_CONFIG_PROVENANCE: 'false' })
              if (p.removeTag) {
                try {
                  npm(['dist-tag', 'rm', p.name, p.tag])
                } catch {
                  console.log(`::warning::Couldn't remove the npm dist-tag ${p.tag} of ${p.name}: on npmjs.com, enable "Allow npm dist-tag" for the trusted publisher release-commit.yml of ${p.name}.`)
                }
              }
            }
            summary.push(isStableRelease ? `- \`${spec}\`` : `- \`${spec}\` — \`npm install ${spec}\``)
          }
          if (GITHUB_STEP_SUMMARY) fs.appendFileSync(GITHUB_STEP_SUMMARY, `### Published to npm\n\n${summary.join('\n')}\n`)

          function isPublished({ name, version }) {
            try {
              const stdout = execFileSync('npm', ['view', `${name}@${version}`, 'version'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] })
              return stdout.trim() === version
            } catch {
              return false
            }
          }
          function npm(args, env) {
            console.log(`$ npm ${args.join(' ')}`)
            execFileSync('npm', args, { stdio: 'inherit', env: { ...process.env, ...env } })
          }
          function list(packages) {
            return packages.map((p) => JSON.stringify(`${p.name}@${p.version}`)).join(', ')
          }
          function fail(msg) {
            console.log(`::error::${msg}`)
            process.exit(1)
          }
          EOF
