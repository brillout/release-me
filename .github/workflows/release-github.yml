# Keeps GitHub Releases in sync with CHANGELOG.md, see https://github.com/brillout/release-me#github-release
# - By pushing a CHANGELOG.md change to main (e.g. a release commit), or
# - by pressing the "Run workflow" button (it then syncs all packages).

# DON'T MODIFY THIS FILE: it's a copy of https://github.com/brillout/release-me/blob/main/.github/workflows/release-github.yml created and updated by `$ pnpm exec release-me init`.

name: Sync GitHub Releases
on:
  push:
    branches:
      - main
    paths:
      # At the root or nested (e.g. packages/some-package/CHANGELOG.md)
      - 'CHANGELOG.md'
      - '**/CHANGELOG.md'
  workflow_dispatch:

# Serialize runs: two quick CHANGELOG.md pushes would otherwise race to create the same release (the loser fails with 422 already_exists). Don't cancel an in-progress run: let a backfill finish.
concurrency:
  group: sync-github-releases
  cancel-in-progress: false

jobs:
  sync:
    # The default branch's CHANGELOG.md is the source of truth: syncing another branch's (selected in "Use workflow from") would delete the releases it doesn't have
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # All commits and tags: release dates and the commits of missing tags are read from the Git history
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm exec release-me sync-github-releases
        env:
          # GITHUB_EVENT_NAME, GITHUB_EVENT_PATH, GITHUB_SHA and GITHUB_REPOSITORY are set by GitHub
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
