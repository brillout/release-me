# The CI of release-me itself (unlike release.yml and release-github.yml, it isn't shipped to users)

name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm test
