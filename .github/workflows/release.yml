# Publishes to npm, see https://github.com/brillout/release-me#github-action
# Don't modify this file: it's a copy of https://github.com/brillout/release-me/blob/main/.github/workflows/release.yml created and updated by `$ pnpm exec release-me init`.
# SECURITY:
# - Only users with write access can trigger this workflow: by pushing a release tag, or by pressing "Run workflow".
# - No caches: the job `pack` (which runs the released commit's code) could poison a cache restored by another release.
name: Release
on:
  push:
    tags: ['v[0-9]*', '**@[0-9]*'] # v1.2.3, some-package@1.2.3
  workflow_dispatch:
    inputs:
      ref: { description: 'Commit (commit-release) or tag (stable-release). Commit: SHA, branch, or refs/pull/<number>/head (default: the selected branch).' }
      package: { description: 'Package (commit-release only, default: all)' }

jobs:
  resolve:
    # Decides what to release.
    # SECURITY: runs the release-me installed by the workflow's commit (as trusted as this file), not by the released commit: the other jobs trust its outputs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      provenance: ${{ steps.resolve.outputs.provenance }}
    steps:
      # Checks out the pushed tag or the "Use workflow from" commit (SAFE)
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # SECURITY: runs no install scripts (neither the dependencies' nor the root package.json's)
      - run: pnpm install --ignore-scripts
      - id: resolve
        run: pnpm exec release-me ci-internal-cmd-resolve

  pack:
    # Builds and packs the packages to publish.
    # SECURITY: runs the released commit's code, which may be untrusted (e.g. a pull request from a fork), so this job can't publish to npm (it doesn't have `id-token: write`).
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checks out the released commit (UNSAFE)
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          # SECURITY: don't store the GitHub token in .git/config, where the released commit's code could read it
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm exec release-me ci-internal-cmd-pack
        # SECURITY: the inputs are passed as env variables, instead of being inserted into `run:` (shell injection)
        env:
          PACKAGES_DIR: release-me-packages
          TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGE: ${{ inputs.package }}
      # SECURITY: the tarballs are the only thing this job passes to the job `publish`
      - uses: actions/upload-artifact@v7
        with:
          name: release-me-packages
          path: release-me-packages/

  publish:
    # Publishes the tarballs made by the job `pack`.
    # SECURITY: the only job that can publish to npm (`id-token: write`). It never runs the released commit's code:
    # - Like the job `resolve`, it runs the release-me installed by the workflow's commit.
    # - It only reads the tarballs: it verifies the package.json inside each one, and `$ npm publish <tarball>` runs no scripts.
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checks out the pushed tag or the "Use workflow from" commit (SAFE)
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Trusted publishing requires npm >= 11.5.1, and removing a dist-tag requires npm >= 11.21.0
      - run: npm install --global npm@latest
      # SECURITY: runs no install scripts (neither the dependencies' nor the root package.json's)
      - run: pnpm install --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-me-packages
          path: release-me-packages
      - run: pnpm exec release-me ci-internal-cmd-publish
        env:
          PACKAGES_DIR: release-me-packages
          TAG: ${{ needs.resolve.outputs.tag }}
          PROVENANCE: ${{ needs.resolve.outputs.provenance }}
