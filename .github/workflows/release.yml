# Publishes to npm, see https://github.com/brillout/release-me#github-action

# DON'T MODIFY THIS FILE: it's a copy of https://github.com/brillout/release-me/blob/main/.github/workflows/release.yml created and updated by `$ pnpm exec release-me init`.

# SECURITY:
# - Only users with write access can trigger this workflow: by pushing a release tag, or by pressing "Run workflow".
# - It runs the released commit's code with npm publish rights: only release commits you trust (review a pull request from a fork before commit-releasing it).

name: Release
on:
  push:
    tags: ['v[0-9]*', '**@[0-9]*'] # v1.2.3, some-package@1.2.3
  workflow_dispatch:
    inputs:
      ref: { description: 'Commit to commit-release: SHA, branch, or refs/pull/<number>/head (default: the selected branch). It runs with npm publish rights: review a pull request from a fork first. To re-publish a stable release, select its tag in "Use workflow from" instead.' }
      package: { description: 'Package (commit-release only, default: all)' }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checks out the released commit
      - uses: actions/checkout@v7
        with:
          # Empty: the pushed tag, or the commit of "Use workflow from"
          ref: ${{ inputs.ref }}
      # Node.js 26 bundles npm >= 11.5.1, which trusted publishing requires
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/action-setup@v6
      - run: pnpm install
      - run: pnpm exec release-me ci-publish
        # SECURITY: the values are passed as env variables, instead of being inserted into `run:` (shell injection)
        env:
          # - Stable release: the release tag (pushed, or selected in "Use workflow from" with an empty input `ref`)
          # - Commit release: empty
          TAG: ${{ github.ref_type == 'tag' && !inputs.ref && github.ref_name || '' }}
          PACKAGE: ${{ inputs.package }}
