# Publishes to npm, see https://github.com/brillout/release-me#github-action
# Don't modify this file: it's a copy of https://github.com/brillout/release-me/blob/main/.github/workflows/release.yml created and updated by `$ pnpm exec release-me init`.
name: Release
on:
  push:
    tags: ['v[0-9]*', '**@[0-9]*'] # v1.2.3, some-package@1.2.3
  workflow_dispatch:
    inputs:
      ref: { description: 'Commit (commit-release) or tag (stable-release). Commit: SHA, branch, or refs/pull/<number>/head (default: the selected branch).' }
      package: { description: 'Package (commit-release only, default: all)' }

jobs:
  resolve:
    # Runs the release-me installed by the workflow's commit, not by the released commit: the other jobs trust its outputs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}
      provenance: ${{ steps.resolve.outputs.provenance }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: pnpm install --ignore-scripts
      - id: resolve
        run: pnpm exec release-me ci-internal-cmd-resolve

  pack:
    # Runs the released commit's code, which may be untrusted (e.g. a pull request from a fork): this job can't publish to npm.
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: pnpm install
      - run: pnpm exec release-me ci-internal-cmd-pack --tag "$TAG" --package "$PACKAGE" --out release-me-packages
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGE: ${{ inputs.package }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-me-packages
          path: release-me-packages/

  publish:
    # The only job that can publish to npm. Like the job `resolve`, it runs the release-me installed by the workflow's commit: it only reads and publishes the tarballs made by the job `pack`.
    needs: [resolve, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      # Trusted publishing requires npm >= 11.5.1, and removing a dist-tag requires npm >= 11.21.0
      - run: npm install --global npm@latest
      - run: pnpm install --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-me-packages
          path: release-me-packages
      - run: pnpm exec release-me ci-internal-cmd-publish
        env:
          PACKAGES_DIR: release-me-packages
          TAG: ${{ needs.resolve.outputs.tag }}
          PROVENANCE: ${{ needs.resolve.outputs.provenance }}
